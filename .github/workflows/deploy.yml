name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /NSM
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must publish from this workflow, not from the branch. If it's still
      # set to "Deploy from a branch", GitHub also publishes the old static site on
      # every push and the two race. Switch it once; harmless if already set, and
      # if the token isn't allowed to change it the deploy still continues.
      - name: Make GitHub Actions the Pages source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || echo unknown)
          echo "Pages build_type: $current"
          if [ "$current" != "workflow" ]; then
            gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow \
              && echo "Switched Pages source to GitHub Actions." \
              || echo "::warning::Couldn't switch Pages source. Set Settings → Pages → Source to GitHub Actions."
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
