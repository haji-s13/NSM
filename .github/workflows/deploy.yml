name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # While Pages is still set to "Deploy from a branch", GitHub also publishes the
  # old static site on every push. page_build fires when that finishes, so this
  # redeploys the Next.js app afterwards and it always ends up live.
  # (Once Pages → Source is "GitHub Actions", page_build no longer fires.)
  page_build:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /NSM
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
